<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>دليفريكو | توصيل سريع وآمن</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff}
body{font-family:Arial,Tahoma,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{width:min(100%,760px);margin:0 auto;padding:18px 18px 24px}
.hero{width:100%;height:auto;display:block;border:2px solid #d9151f;border-radius:32px;box-shadow:0 0 0 1px rgba(255,0,0,.15),0 14px 42px rgba(255,0,0,.18)}
h1{font-size:clamp(48px,9vw,76px);line-height:1;margin:30px 0 8px;text-align:center;font-weight:800;letter-spacing:-1px}
.tag{text-align:center;color:#ddd;margin:0 0 34px;font-size:clamp(22px,4.2vw,34px);font-weight:500}
.buttons{display:grid;gap:22px;margin:0 auto;max-width:680px}
.btn{position:relative;min-height:132px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;padding:22px 74px 22px 92px;border-radius:34px;font-size:clamp(25px,5vw,39px);font-weight:800;border:3px solid #ef1b25;box-shadow:0 0 0 1px rgba(255,0,0,.18),0 10px 24px rgba(0,0,0,.5);transition:transform .15s ease,filter .15s ease;overflow:hidden}
.btn:active{transform:scale(.985)}
.btn:hover{filter:brightness(1.08)}
.btn::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 38%,rgba(0,0,0,.08))}
.wa{background:linear-gradient(180deg,#16c84a 0%,#08a83c 100%)}
.fb{background:linear-gradient(180deg,#1675ed 0%,#0961d4 100%)}
.icon{position:absolute;right:26px;top:50%;transform:translateY(-50%);width:82px;height:82px;color:#fff;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.wa-icon{width:86px;height:86px}
.fb-icon{width:82px;height:82px}
.btn span{position:relative;z-index:3}
.phone{text-align:center;color:#fff;font-size:clamp(24px,4.8vw,38px);font-weight:800;margin:24px 0 6px}
.phone-number{display:block;color:#ed2028;text-decoration:none;font-size:clamp(35px,7vw,55px);font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;direction:ltr}
footer{text-align:center;color:#aaa;font-size:clamp(16px,3vw,23px);margin:18px 0 0}
@media (max-width:520px){
  .wrap{padding:10px 10px 20px}
  .hero{border-radius:25px}
  h1{margin-top:25px}
  .tag{margin-bottom:25px}
  .buttons{gap:16px}
  .btn{min-height:112px;border-radius:29px;padding-right:70px;padding-left:35px}
  .icon{right:18px;width:64px;height:64px}
  .wa-icon{width:68px;height:68px}
  .fb-icon{width:64px;height:64px}
}
</style>
</head>
